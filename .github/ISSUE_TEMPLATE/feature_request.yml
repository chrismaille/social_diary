name: Idea
description: Something you'd like the diary to remember, or to do.
labels: ["idea"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the idea. Start from the game rather than the addon: what happened, and what you wish the diary had written down.
        Only half an idea, or a question? [Discussions](https://github.com/social-diary/social_diary/discussions) is a good place for that.

  - type: textarea
    id: moment
    attributes:
      label: The moment in the game
      description: What happened in the game that this is about?
      placeholder: Garrick Fallow and I held off the Defias at the Jangolode Mine until help came. A week later I saw him in Duskwood and couldn't remember why I knew him.
    validations:
      required: true

  - type: textarea
    id: wish
    attributes:
      label: What you'd like the diary to do
      description: What should it write down, show or remind you of?
      placeholder: Note the fight on his page, so I'd know him when we cross paths again.
    validations:
      required: true

  - type: textarea
    id: anything-else
    attributes:
      label: Anything else
      description: Other addons that do something like it, screenshots, or anything else that helps.
    validations:
      required: false
