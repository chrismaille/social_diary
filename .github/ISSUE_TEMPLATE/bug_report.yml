name: Bug report
description: Something in Social Diary went wrong or looks wrong.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for writing this down. The more of the fields below you can fill in, the sooner it can be fixed.
        Not sure it's a bug? Ask in [Discussions](https://github.com/social-diary/social_diary/discussions) first.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you see, and what did you expect to see instead?
      placeholder: I grouped with Bram Redfen in Westfall, but the timeline shows nothing for today.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to make it happen again
      description: If you know how to make it happen again, list the steps.
      placeholder: |
        1. Open the journal with /sd
        2. Go to People and open Garrick Fallow's page
        3. Click the map
    validations:
      required: false

  - type: input
    id: addon-version
    attributes:
      label: Social Diary version
      description: Shown next to the heading in Social Diary's Settings, or in the `## Version` line of social_diary.toc.
      placeholder: "1.5.0"
    validations:
      required: true

  - type: input
    id: game-build
    attributes:
      label: Game build
      description: Shown at the bottom of the login screen, or type `/run print(GetBuildInfo())` in chat.
      placeholder: The version and build number
    validations:
      required: true

  - type: dropdown
    id: questie
    attributes:
      label: Is Questie installed?
      options:
        - "No"
        - Questie + QuestieDB
        - Only Questie
      default: 0
    validations:
      required: true

  - type: textarea
    id: lua-error
    attributes:
      label: Lua error
      description: |
        If the game showed an error, paste the whole text here. [BugSack](https://www.curseforge.com/wow/addons/bugsack) with BugGrabber catches errors for you. Without them, type `/console scriptErrors 1` in chat so the game shows them.
      render: text
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag images in here. For anything about the look of the book, a screenshot helps most.
    validations:
      required: false
