# Packages a release when a version tag is pushed:
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# The tag must match the TOC's ## Version line. Tests run first; the zip
# (without Dev/, tests/ and the rest .pkgmeta ignores) lands on a GitHub
# release with CHANGELOG.md as its notes. CurseForge or Wago uploads need
# their project id in the TOC and an API token secret, see
# https://github.com/BigWigsMods/packager.

name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches the TOC version
        run: |
          toc=$(sed -n 's/^## Version: *//p' social_diary.toc | tr -d '\r')
          if [ "v$toc" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match ## Version: $toc in social_diary.toc"
            exit 1
          fi

      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit

      - name: Run tests
        run: luajit tests/run.lua

  package:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: BigWigsMods/packager@v2
