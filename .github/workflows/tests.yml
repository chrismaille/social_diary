# Runs the offline test suite (tests/run.lua against the WoW API mock) on
# every push to main and every pull request. Releases run it again before
# packaging (release.yml).

name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit

      - name: Run tests
        run: luajit tests/run.lua
