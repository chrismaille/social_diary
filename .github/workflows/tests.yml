# Runs the lint and the offline test suite (tests/run.lua against the WoW
# API mock) on every push to main and every pull request. These are the same
# `make` targets the pre-commit hooks run. Releases run them again before
# packaging (release.yml).

name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install LuaJIT and luacheck
        run: sudo apt-get update && sudo apt-get install -y luajit lua-check

      - name: Lint
        run: make lint

      - name: Tests
        run: make tests
