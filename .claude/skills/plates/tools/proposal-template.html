<!doctype html>

<!--
  Proposal template: margin notes and cards on Your Diary's plates (the plates skill, §6).

  Start a proposal:
    cp .claude/skills/plates/tools/proposal-template.html .claude/ui-proposal/<name>-mockup.html
    then edit only the DESIGN block (search @@DESIGN-BEGIN@@; its comment is the API) and delete its example.
  Geometry: the block between @@LAYOUT-BEGIN@@ and @@LAYOUT-END@@ is generated from the addon's tables:
    .claude/skills/plates/tools/layout.sh [mockup.html ...]      (no file: this template)
  Sizes, by the width of the box a note gets:
    XL >= 190 px · L 150-189 · M 122-149 · S one line in the hand at 14 px, fits 122
    (S: filler under a light plate's caption; a light plate's print with print: true).
  Handover: "Copy handover" puts Markdown on the clipboard: proposal, view toggles, picks (variant · size),
    comments with what each is attached to (variant, size, board, slot, page) and what that note took there.
  Review state lives in localStorage under "sd-proposal:<name>". #flat opens with flat paper.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Neuton:ital@1&display=swap" rel="stylesheet">
<style>
  /* ================================================================ LIBRARY (don't touch) */
  @font-face { font-family: "SDHand"; font-style: italic;
    src: url("../../../../Fonts/Neuton-Italic.ttf"), url("../../Fonts/Neuton-Italic.ttf"), url("../Fonts/Neuton-Italic.ttf"); }
  :root {
    --page: #cfb789; --ink: #3d2912; --strong: #211408; --faded: #705936; --graphite: #4f4c47; --rubric: #801a0d;
    --strip: rgb(242,232,201); --tagp: rgb(250,242,222); --stock: rgb(236,226,200);
    --friz: "Marcellus", Georgia, serif; --hand: "SDHand", "Neuton", Georgia, serif;
    /* the review tools: a cool slate, so nothing of them reads as the diary's */
    --ui: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --ui-ink: #a7b3bd; --ui-dim: #74818c; --ui-hi: #d5dee5; --ui-pick: #8fb0cf; --ui-bad: #d49a8c; --ui-line: #3a3129;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  html { overflow-anchor: none; }
  body { font-family: var(--friz); color: var(--ink); background: #2a1a0d; padding: 0 28px 64px; min-width: 1200px; }

  /* the bar: the review's own controls */
  #bar { position: sticky; top: 0; z-index: 50; margin: 0 -28px 18px; padding: 8px 28px 9px; background: #1c120a;
    border-bottom: 1px solid var(--ui-line); font: 12px/1.6 var(--ui); color: var(--ui-ink); display: flex; flex-wrap: wrap; gap: 4px 22px; align-items: center; }
  #bar .who { color: var(--ui-hi); font-weight: 600; letter-spacing: .01em; }
  #bar .who small { font-weight: 400; color: var(--ui-dim); margin-left: 6px; }
  #bar nav a { color: var(--ui-ink); text-decoration: none; margin-right: 10px; }
  #bar nav a:hover { color: var(--ui-hi); }
  .grp { display: inline-flex; gap: 3px; align-items: center; flex-wrap: wrap; }
  .grp > span { color: var(--ui-dim); margin-right: 3px; }
  .chip { font: 11px/1 var(--ui); color: var(--ui-ink); background: transparent; border: 1px solid #4a4038; border-radius: 3px; padding: 3px 6px; cursor: pointer; }
  .chip:hover { border-color: var(--ui-dim); color: var(--ui-hi); }
  .chip.on { background: #2f3a44; border-color: #5f7383; color: var(--ui-hi); }
  .chip:disabled { opacity: .35; cursor: default; }
  #bar .act { margin-left: auto; display: inline-flex; gap: 6px; }
  #bar .act .chip { padding: 4px 9px; }
  #bar .act .main { border-color: #5f7383; color: var(--ui-hi); }
  #errors { display: none; margin: 0 0 14px; padding: 8px 12px; border: 1px solid #7a3b2e; background: #2b130c; font: 12px/1.5 var(--ui); color: var(--ui-bad); white-space: pre-wrap; }

  section.board { margin: 0 0 40px; }
  h2 { margin: 0 0 8px; font: 13px/1.4 var(--friz); letter-spacing: .12em; text-transform: uppercase; color: #e9d48f; display: flex; gap: 14px; align-items: baseline; }
  h3 { margin: 20px 0 8px; font: 15px/1.3 var(--friz); color: #f2ead4; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  h3 small, .lab small { font: 11px var(--ui); color: var(--ui-dim); letter-spacing: 0; text-transform: none; }
  .lab { font: 11px/1.4 var(--ui); color: var(--ui-ink); margin: 0 0 4px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .lab b { color: var(--ui-hi); font-weight: 600; }
  .stat { font: 11px/1.4 var(--ui); color: var(--ui-dim); margin: 4px 0 0; max-width: 100%; }
  .stat b { color: var(--ui-ink); font-weight: 600; }
  .stat .bad { color: var(--ui-bad); }
  .row { display: flex; flex-wrap: wrap; gap: 18px 20px; align-items: flex-start; }
  .band { margin: 6px 0 16px; }
  .band > .lab { font-size: 12px; }

  /* review controls: quiet until used */
  .rv { display: inline-flex; gap: 6px; align-items: baseline; flex-wrap: wrap; font: 11px var(--ui); }
  .rv button { font: 11px var(--ui); background: none; border: 0; padding: 0; color: var(--ui-dim); cursor: pointer; }
  .rv button:hover { color: var(--ui-hi); }
  .rv .rv-pick::before { content: "○ "; }
  .rv .rv-pick.on { color: var(--ui-pick); font-weight: 600; }
  .rv .rv-pick.on::before { content: "● "; }
  .rv .rv-c.has { color: var(--ui-ink); }
  .rv textarea { display: block; flex-basis: 100%; width: 100%; min-width: 220px; margin: 3px 0 0; padding: 5px 7px; resize: vertical;
    font: 12px/1.4 var(--ui); color: var(--ui-hi); background: #20160e; border: 1px solid #4a4038; border-radius: 3px; }
  .rv textarea[hidden] { display: none; }
  .fig { display: flex; flex-direction: column; }

  /* paper */
  .sheet { position: relative; background-color: var(--page); overflow: hidden;
    box-shadow: 0 0 0 1px #1b0c04, 6px 8px 12px -4px rgba(0,0,0,.6);

  .tape.corner { width: 22px; height: 10px; }

  .mount { position: absolute; transform-origin: 50% 50%; z-index: 1; }
  .plate { position: absolute; inset: 0; background-color: #e4d6b0;
    background-image: linear-gradient(135deg, rgba(255,250,232,.16), rgba(61,41,18,.07));

  .lift { position: absolute; width: 40px; height: 34px; pointer-events: none; z-index: -1; }

  .lift.bl { left: -6px; bottom: -7px; background: radial-gradient(36px 30px at 0% 100%, rgba(61,41,18,.34), transparent 70%); }
  .art { position: absolute; overflow: hidden; box-shadow: 0 0 0 1.5px rgba(33,20,8,.62); }
  .art svg { display: block; }
  .pc { position: absolute; width: var(--pc); height: var(--pc); pointer-events: none; filter: drop-shadow(0.7px 0.9px 0 rgba(20,12,4,.5)); z-index: 5; }
  .pc i { position: absolute; inset: 0; display: block; background: #2e2014; }
  .pc.tl { left: -4px; top: -4px; }    .pc.tl i { clip-path: polygon(0 0, 100% 0, 0 100%); }
  .pc.tr { right: -4px; top: -4px; }   .pc.tr i { clip-path: polygon(0 0, 100% 0, 100% 100%); }
  .pc.bl { left: -4px; bottom: -4px; } .pc.bl i { clip-path: polygon(0 0, 100% 100%, 0 100%); }
  .pc.br { right: -4px; bottom: -4px; } .pc.br i { clip-path: polygon(100% 0, 100% 100%, 0 100%); }
  .onprint { position: absolute; z-index: 7; }
  .cap { position: absolute; z-index: 6; }
  .cap.right { text-align: right; }
  .cap-h { font: italic 16px/18px var(--hand); color: var(--strong); white-space: nowrap; }
  .cap-l { font: 13px/15px var(--friz); color: var(--ink); white-space: nowrap; }
  .nt { position: absolute; z-index: 8; }
  .leaders { position: absolute; left: 0; top: 0; width: 466px; height: 534px; pointer-events: none; overflow: visible; z-index: 7; }

  /* hints (the review's, not the diary's): boxes, limits, the variant's outline */
  .hint { position: absolute; pointer-events: none; z-index: 9; }
  .hint.box { outline: 1px dashed rgba(143,176,207,.75); }
  .hint.lim { height: 0; border-top: 1px solid rgba(143,176,207,.65); }
  .hint.lim span { position: absolute; right: 0; top: -12px; font: 9px/11px var(--ui); color: rgba(60,80,100,.9); }
  .nt.hl::after { content: ""; position: absolute; inset: -3px; outline: 1px dashed rgba(70,110,150,.75); pointer-events: none; }
  body.nohints .hint, body.nohints .nt.hl::after { display: none; }

  /* laid flat ("Flat paper only") */
  body.flat .slip, body.flat .mount { transform: none !important; }
  body.flat .slip { box-shadow: none; outline-color: rgba(61,41,18,.32); }
  body.flat .plate { box-shadow: 0 0 0 1px rgba(61,41,18,.30); background-image: none; }
  body.flat .lift { display: none; }
  body.flat .pc { filter: none; }
  body.flat .tape { background: rgba(224,199,122,.62); box-shadow: none; }

  #copied { position: fixed; inset: 60px 80px auto auto; z-index: 60; width: 560px; max-height: 70vh; display: none; flex-direction: column; gap: 6px;
    padding: 10px; background: #1c120a; border: 1px solid #5f7383; font: 12px var(--ui); color: var(--ui-ink); }
  #copied textarea { width: 100%; height: 50vh; font: 12px/1.45 ui-monospace, Menlo, monospace; color: var(--ui-hi); background: #20160e; border: 1px solid #4a4038; }
</style>

const tookText = p => `${p.r.size}${p.r.step ? ` (step ${p.r.step})` : ""}, ${Math.round(p.r.w)} × ${Math.round(p.r.h)} in a ${Math.round(p.box.w)} px box`;

// ---------------------------------------------------------------- review: picks and comments, saved per proposal
const STORE = () => "sd-proposal:" + PROPOSAL.name;

const LABELS = {};
function load() { try { const s = JSON.parse(localStorage.getItem(STORE()) || "null"); if (s) STATE = Object.assign(STATE, s); } catch (e) {}
  if (STATE.view) Object.assign(VIEW, STATE.view, { nb: Object.assign({}, VIEW.nb, STATE.view.nb), hide: Object.assign({}, STATE.view.hide) });
  if (location.hash === "#flat") VIEW.flat = true; }
function save() { STATE.view = VIEW; try { localStorage.setItem(STORE(), JSON.stringify(STATE)); } catch (e) {} }
function rv(key, what, pick) {

document.addEventListener("click", e => {

document.addEventListener("input", e => {

  const key = t.closest(".rv").dataset.k;

  const c = t.closest(".rv").querySelector(".rv-c"); c.classList.toggle("has", !!STATE.comments[key]); c.textContent = STATE.comments[key] ? "comment" : "+ comment"; save();

function viewLines() {
  const nb = NEIGHBOURS.filter(n => VIEW.nb[n.kind]).map(n => n.label);
  return [`- paper: ${VIEW.flat ? "flat (Flat paper only)" : "turned, with shadows"}`,
    `- route kept: ${VIEW.kept ? `yes, notes stop at ${GEO.CAPTION.limit}` : `no, notes stop at ${GEO.CAPTION.offLimit} (the not-kept line)`}`,
    `- captions: a heading and ${VIEW.lines} line${VIEW.lines > 1 ? "s" : ""} of words (one over a plate)`,
    `- neighbours: ${nb.length ? nb.join(", ") : "none"}`, `- zoom ${VIEW.zoom}×`,
    `- variants shown: ${VARIANTS.filter(v => !VIEW.hide[v.id]).map(v => v.id).join(", ") || "none"}`];
}
function handover() {

  const rank = k => ["v:", "board:", "slot:", "page:"].findIndex(p => k.startsWith(p));
  const keys = o => Object.keys(o).sort((a, b) => rank(a) - rank(b) || a.localeCompare(b));
  const out = [`# Handover: ${P.name}${P.feature ? ` (${P.feature})` : ""}${P.date ? `, ${P.date}` : ""}`, "",
    `Mockup: ${decodeURIComponent(location.pathname).split("/").slice(-3).join("/")}`, "", "## View", ...viewLines(), "", "## Picks"];
  const picks = keys(STATE.picks); out.push(...(picks.length ? picks.map(k => `- ${label(k)}`) : ["- none"]));

}
function copyHandover(btn) {

  const fallback = () => { const d = document.getElementById("copied"), t = d.querySelector("textarea"); t.value = text; d.style.display = "flex"; t.select(); try { if (document.execCommand("copy")) done(); } catch (e) {} };

}

// ---------------------------------------------------------------- the boards
const shown = () => VARIANTS.filter(v => !VIEW.hide[v.id]);
const vName = v => `variant ${v.id} "${v.label}"`;
const zoomed = html => `<div style="zoom:${VIEW.zoom}">${html}</div>`;
function orderNote(v) {
  const near = [...NEIGHBOURS.map(n => ({ l: n.label, o: KIND_ORDER(n.kind) }))].sort((a, b) => a.o - b.o);
  const before = near.filter(n => n.o <= v.order).pop(), after = near.find(n => n.o > v.order);
  return `order ${v.order}${before ? `, after ${before.l} (${before.o})` : ""}${after ? `, before ${after.l} (${after.o})` : ""}${v.filler ? " · filler" : ""}${v.print ? " · S on a light print" : ""}${v.smaller ? ` · ${v.smaller} step${v.smaller > 1 ? "s" : ""} smaller` : ""}`;
}
function buildSizes() {
  let h = `<h2>Sizes ${rv("board:sizes", "board Sizes")}</h2>`;
  for (const v of VARIANTS) {
    h += `<h3>${esc(v.id)} · ${esc(v.label)} <small>${orderNote(v)}</small> ${rv("v:" + v.id, vName(v), true)}</h3><div class="row">`;
    for (const s of SIZES) {
      let inner = "";
      if (!v.sizes[s]) inner = `<div class="none">no ${s}</div>`;
      else {
        for (const w of BAND_WIDTHS[s]) { const r = render(v, s, 0, { w, where: s === "S" ? (v.print ? "print" : "light") : "board", seed: "sizes" });
          inner += `<div><div class="wr" style="width:${w}px"><span>${w} px${r ? ` · ${Math.round(r.w)} × ${Math.round(r.h)}` : ""}</span></div>${r ? r.html : `<div class="none">does not go in ${w} px</div>`}</div>`; }
        const sw = BAND_WIDTHS[s][BAND_WIDTHS[s].length > 1 ? 1 : 0], r0 = render(v, s, 0, { w: sw, where: "board", seed: "sizes" });
        for (let st = 1; st <= v.smaller; st++) { const w = sw, r = render(v, s, st, { w, where: "board", seed: "sizes" });
          if (r && r0 && r.html === r0.html) continue;
          inner += `<div><div class="wr" style="width:${w}px"><span>step ${st} · ${r ? `${Math.round(r.w)} × ${Math.round(r.h)}` : "none"}</span></div>${r ? r.html : ""}</div>`; }
      }

// Every real box (GEO.LAYOUT), as the slots board shows them.
function slotBoxes() {
  const out = [], seenPrint = {};
  const keys = ["1", "2", "3", "FL", "LF", "FFL", "FLF", "LFF", "LFL", "F+L"];
  for (const key of keys) (GEO.LAYOUT[key] || []).forEach((slot, i) => {
    const n = `${key} · plate ${i + 1}`;
    if (slot.light) {
      out.push({ id: `${key}/${i + 1}/caption`, key, i, slot, kind: "light", band: "S", label: `${n} (light), under its caption, ${slot.cap.w} px` });
      const pk = `${slot.w}x${slot.h}:${slot.lift || ""}`;
      if (!seenPrint[pk]) { seenPrint[pk] = true; out.push({ id: `${key}/${i + 1}/print`, key, i, slot, kind: "print", band: "S", label: `${n}, on its print (${slot.w} × ${slot.h}${slot.lift ? ", lifted" : ""})` }); }
      return;
    }
    const rows = slot.row ? [[slot, key]] : slot.top ? [[slot.top, "1 · top"]] : [];
    if (slot.notes) out.push({ id: `${key}/${i + 1}/notes`, key, i, slot, kind: "column", box: slot.notes, band: bandOf(slot.notes.w), label: `${n}, its notes column, ${slot.notes.w} px` });
    if (!slot.row) out.push({ id: `${key}/${i + 1}/caption`, key, i, slot, kind: "caption", band: bandOf(slot.cap.w), label: `${n}, under its caption, ${slot.cap.w} px${slot.cap.align === "RIGHT" ? " flush right" : ""}` });
    for (const [rs, rk] of rows) {
      out.push({ id: `${rk}/row`, key: rk, i, slot: rs, kind: "row", band: "M", label: `${rk}, the row of ${rs.row.length} × ${rs.row[0].w} px` });
      out.push({ id: `${rk}/shared`, key: rk, i, slot: rs, kind: "shared", band: "XL", label: `${rk}, the row shared (fewer notes than boxes)` });
    }

}
function nbSpecs() { return NEIGHBOURS.filter(n => VIEW.nb[n.kind]); }
function slotCell(v, b) {
  const foot = footOf(), slot = b.slot, seed = `${v.id}:${b.id}`;
  let specs = nbSpecs().concat([v]), o = { slot, i: b.i, seed };
  if (b.kind === "light") { if (!v.filler) return null; specs = specs.filter(s => s.filler); o.light = true; }
  else if (b.kind === "print") { if (!v.print) return null; specs = []; o.light = true; o.printV = v; o.boxes = () => []; }
  else if (b.kind === "row" || b.kind === "shared") { o.over = true; if (b.kind === "shared") specs = nbSpecs().filter(s => !s.filler).slice(0, slot.row.length - 2).concat([v]); }
  else if (b.kind === "column") o.boxes = () => [Object.assign({ where: "column" }, b.box)];
  else o.boxes = capFoot => [{ x: slot.cap.x, y: capFoot + GEO.CAPTION.notes, w: slot.cap.w, limit: slot.cap.limit, align: slot.cap.align, where: "column" }];
  const L = layPlate(Object.assign(o, { specs }));
  // the crop: the box (or the row, or the print) and its caption, down to its limit
  let x0, x1, y0, y1;
  if (b.kind === "print") { x0 = slot.x - 14; x1 = slot.x + slot.w + 14; y0 = slot.y - 14; y1 = slot.y + slot.h + 16; }
  else if (b.kind === "row" || b.kind === "shared") { x0 = 0; x1 = 466; y0 = slot.row[0].y - 26; y1 = foot + 12; }
  else { const bx = L.boxes[0] || { x: slot.cap.x, w: slot.cap.w }; x0 = bx.x - 14; x1 = bx.x + bx.w + 14;
    y0 = (b.kind === "column" ? b.box.y : slot.cap.y) - 10; y1 = Math.min((L.boxes[0] && L.boxes[0].limit) || foot, foot) + 12; }
  const W = Math.round(x1 - x0), H = Math.round(y1 - y0);
  const lim = `<div class="hint lim" style="left:${x0}px;top:${foot}px;width:${W}px"><span>${foot}</span></div>`;
  const off = VIEW.kept ? "" : `<div class="offl"></div>`;
  const page = `<div class="rp" style="left:${-x0}px;top:${-y0}px">${L.plate}${b.kind === "print" ? "" : L.cap}<svg class="leaders">${L.leaders}</svg>${L.notes}${L.hint}${lim}${off}</div>`;
  let stat;
  if (b.kind === "print") stat = L.printed && L.printed.r ? `<b>S</b> on the print, ${Math.round(L.printed.r.w)} of ${L.printed.room} px` : `<span class="bad">S does not fit the print (${L.printed ? L.printed.room : "?"} px)</span>`;
  else stat = L.v ? `<b>${tookText(L.v)}</b>` : `<span class="bad">left off</span>`;
  if (L.left.length) stat += ` · left off: ${L.left.map(it => it.label).join(", ")}`;
  const key = `slot:${v.id}/${b.id}`, what = `slot ${b.label}, ${vName(v)}: ${stat.replace(/<[^>]+>/g, "")}`;
  return `<div class="fig"><div class="lab">${esc(b.label)} ${rv(key, what)}</div><div class="sheet" style="width:${W * VIEW.zoom}px;height:${H * VIEW.zoom}px">${zoomed(`<div style="position:relative;width:${W}px;height:${H}px;overflow:hidden">${page}</div>`)}</div><div class="stat">${stat}</div></div>`;
}
function buildSlots() {
  let h = `<h2>Slots ${rv("board:slots", "board Slots")}</h2>`;
  const boxes = slotBoxes();
  for (const v of shown()) {
    h += `<h3>${esc(v.id)} · ${esc(v.label)}</h3>`;
    for (const band of ["XL", "L", "M", "S"]) {
      const cells = boxes.filter(b => b.band === band).map(b => slotCell(v, b)).filter(Boolean);
      if (cells.length) h += `<div class="band"><div class="lab"><b>${band}</b><small>${band === "S" ? "light plates: under the caption (filler), on the print (print)" : `boxes of ${BANDS[band][1] === Infinity ? "≥ " + BANDS[band][0] : BANDS[band][0] + "–" + BANDS[band][1]} px`}</small></div><div class="row">${cells.join("")}</div></div>`;
    }

}
const PAGES = [
  { key: "1", name: "one plate, caption under" }, { key: "1 · top", name: "one plate, caption on top", top: true },
  { key: "F+L", name: "full plate with a print tucked in" }, { key: "2", name: "two plates" }, { key: "3", name: "three plates" },
  { key: "FL" }, { key: "LF" }, { key: "FFL" }, { key: "FLF" }, { key: "LFF" }, { key: "LFL" },

function pageCell(v, P) {
  const slots = P.top ? [GEO.LAYOUT["1"][0].top] : GEO.LAYOUT[P.key];
  if (!slots) return "";

  const hk = `${v.id}@${P.key}`; let host = STATE.hosts[hk];

    const L = layPlate({ slot, i, specs, over, light, seed: `${v.id}:${P.key}:${i}`, printV: isHost && light && v.print ? v : null });
    parts.plates += L.plate; parts.caps += L.cap; parts.notes += L.notes; parts.leaders += L.leaders; parts.hint += L.hint;
    if (isHost) {
      let s = `plate ${i + 1}: `;
      if (L.printed) s += L.printed.r ? `<b>S on the print</b>, ${Math.round(L.printed.r.w)} of ${L.printed.room} px` : `<span class="bad">S does not fit the print (${L.printed.room} px)${P.key === "F+L" ? ": F+L not kept, the page is FL" : ""}</span>`;
      else s += L.v ? `<b>${tookText(L.v)}</b>` : (specs.includes(v) ? `<span class="bad">left off</span>` : "nothing of it here");
      if (L.left.length) s += ` · left off: ${L.left.map(it => it.label).join(", ")}`;
      if (slot.whole && L.left.length) s += ` · <span class="bad">F+L not kept: its row must hold the whole margin (the page is FL)</span>`;
      stats.push(s);
    }
  });
  if ((P.top || P.key === "F+L") && VIEW.lines > 1) stats.push("caption over a plate: a heading and one line, at most");
  const hosts = slots.length > 1 ? `<span class="grp"><span>on plate</span>${slots.map((s, i) => `<button type="button" class="chip${i === host ? " on" : ""}" data-host="${hk}" data-i="${i}"${can[i] ? "" : " disabled"}>${i + 1}${s.light ? " L" : ""}</button>`).join("")}</span>` : "";
  const stat = stats.join("<br>");
  const key = `page:${v.id}/${P.key}`, what = `page ${P.key}${P.name ? ` (${P.name})` : ""}, ${vName(v)}, ${stat.replace(/<br>/g, "; ").replace(/<[^>]+>/g, "")}`;
  const off = VIEW.kept ? "" : `<div class="offl"></div>`;
  const pg = `<div class="sheet pg"><div class="rp">${parts.plates}${parts.caps}<svg class="leaders">${parts.leaders}</svg>${parts.notes}${parts.hint}${off}</div></div>`;
  return `<div class="fig"><div class="lab"><b>${esc(P.key)}</b><small>${esc(P.name || "")}</small>${hosts} ${rv(key, what)}</div><div style="width:${486 * VIEW.zoom}px;height:${564 * VIEW.zoom}px">${zoomed(pg)}</div><div class="stat" style="max-width:${486 * VIEW.zoom}px">${stat}</div></div>`;
}
function buildPages() {

document.addEventListener("click", e => { const b = e.target.closest("[data-host]"); if (!b) return; STATE.hosts[b.dataset.host] = +b.dataset.i; save(); buildPages(); });

// ---------------------------------------------------------------- the bar
function buildBar() {

    <span class="grp"><span>variants</span>${VARIANTS.map(v => chip(!VIEW.hide[v.id], `data-show="${esc(v.id)}"`, esc(v.id), v.label)).join("")}</span>
    <span class="act">${chip(false, 'data-act="copy"', "Copy handover", "", "main")}${chip(false, 'data-act="clear"', "Clear")}</span>`;

document.getElementById("bar").addEventListener("click", e => {

document.getElementById("copiedClose").addEventListener("click", () => document.getElementById("copied").style.display = "none");

function buildAll() {

  for (const [name, fn] of [["bar", buildBar], ["sizes", buildSizes], ["slots", buildSlots], ["pages", buildPages]]) { try { fn(); } catch (e) { oops("board " + name, e); } }

<script>
/* @@DESIGN-BEGIN@@ ================================================== DESIGN (the only part a proposal edits)

    mark: K => svg,                     optional: its mark on the plate about 0,0 (the paper halo is drawn for it)
    filler: true,                       optional: filler (last; S under a light plate's caption)
    print: true,                        optional: its S goes on a light plate's print, never the margin
  })

// A strip: "A duel won" in the hand, who and how long in Friz; B underlines "won". Step 1 drops the time.
const duel = under => (box, { K, seed, step }) => {
  const P = K.STRIP_PAD, w = box.w, room = w - P[0] - P[2];
  const hs = K.hand("A duel won", 16) <= room ? 16 : 14, lines = K.wrap(step ? "against Brannoc" : "against Brannoc, two minutes of it", "friz", 11, room, 2);
  let svg = K.text(P[0], P[1], "A duel won", { size: hs });
  if (under) { const x = P[0] + K.hand("A duel ", hs); svg += K.underline(x, x + K.hand("won", hs), K.base(P[1], "hand", hs), seed); }
  lines.forEach((l, i) => svg += K.text(P[0], P[1] + K.lh("hand", hs) + 1 + i * 13, l, { font: "friz" }));
  return K.slip({ w, h: P[1] + K.lh("hand", hs) + 1 + lines.length * 13 + P[3], seed, svg });
};
const duelS = (box, { K, seed }) => {
  const t = "won a duel", w = Math.ceil(K.hand(t, 14)) + 17;
  return w > box.w ? null : K.slip({ w, h: 26, seed, tape: "corner", svg: K.text(7, 4, t, { size: 14 }) });
};
const swords = K => K.line(-4.5, 4.5, 4.5, -4.5, { width: 1.8 }) + K.line(-4.5, -4.5, 4.5, 4.5, { width: 1.8 });
variant({ id: "A", label: "Duel strip", order: 55, smaller: 1, mark: swords, sizes: { S: duelS, M: duel(false), L: duel(false), XL: duel(false) } });
variant({ id: "B", label: "Duel strip, underlined", order: 55, smaller: 1, mark: swords, sizes: { M: duel(true), L: duel(true), XL: duel(true) } });
